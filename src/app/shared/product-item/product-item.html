<h1>#4 Pipes, ngFor, routeLink, pass props, @Input, @Output of Parent and child component</h1>

<div class="my-cart">
  <button type="button" (click)="onCart()">
    Giỏ hàng ({{ cartCount }})
  </button>
  <button type="button" (click)="onBuyClick()" [class.primary]="true">
    Mua hàng
  </button>
</div>

<div class="cart-table">
  <div class="cart-row cart-header">
    <div>ID</div>
    <div>Name</div>
    <div>Price</div>
    <div>Action</div>
  </div>

  <div class="cart-row" *ngFor="let product of products">
    <div>
      <a [routerLink]="['/detail', product.id]">
        {{ product.id}}
      </a>
    </div>
    <div>{{ product.name | upperCasePipe }}</div>
    <div>{{ product.price | currencyPipe }}</div>
    <div>
      <button type="button">Remove</button>
    </div>
  </div>      
</div>
