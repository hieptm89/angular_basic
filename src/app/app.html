<main class="cart-page">
    <!-- ----------------------------------------------------------------------------------- -->
    <h1>#1 Text, Properties, Attributes, Event, @Input, @Output</h1>
    <!-- Binding object properties -->    
    <div>{{ user.name }}</div>

    <!-- Event -->
    <button (click)="sayHello()">Click me to show text</button>
    
    <!-- Text -->
    <div>{{ title }}</div>

    <!-- Properties binding -->
    <button [disabled]="isDisabled" (click)="toggleDisabled()">Toggle Disabled</button>

    <!-- Attributes binding -->
    <button [attr.aria-label]="'buy-button-' + cartCountParent">Mua (aria)</button>

    <!-- innerHTML -->
    <div [innerHTML]="htmlSnipet"></div>

    <!-- Class & style binding -->
    <div [class.active]="active" [style.color]="active ? 'green' : 'gray'"> 
        Trạng thái : {{ active ? 'Active' : 'Inactive' }}
    </div>

    <!-- Child component with Input/Output -->
    <header-layout [cartCount]="cartCountParent" (buy)="onBuyParent()"></header-layout>
    
    <!-- ----------------------------------------------------------------------------------- -->
    <h1>#2 Two way binding</h1>
    <label>
        Your name: 
        <input [(ngModel)]="userName" placeholder="Nhập tên" />
    </label>
    <p>{{userName}}</p>

    <!-- ----------------------------------------------------------------------------------- -->
    <h1>#3 Pipes, ngFor</h1>
    <div class="cart-table">
      <div class="cart-row cart-header">
        <div>Name</div>
        <div>Price</div>
        <div>Action</div>
      </div>

      <div class="cart-row" *ngFor="let product of products">
        <div>{{ product.name | upperCasePipe }}</div>
        <div>{{ product.price | currencyPipe }}</div>
        <div>
          <button type="button">Remove</button>
        </div>
      </div>
      
    </div>
</main>

<router-outlet />
