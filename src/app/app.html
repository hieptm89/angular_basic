<main class="main">
    <!-- Text -->
    <div>{{ title }}</div>

    <!-- Binding object properties -->
    <div>{{ user.name }}</div>
    <div>{{ user.old }}</div>

    <!-- Properties binding -->
    <button [disabled]="isDisabled" (click)="toggleDisabled()">Toggle Disabled</button>

    <!-- Attributes binding -->
    <button [attr.aria-label]="'buy-button-' + cartCount">Mua (aria)</button>

    <!-- innerHTML -->
    <div [innerHTML]="htmlSnipet"></div>

    <!-- Class & style binding -->
    <div [class.active]="active" [style.color]="active ? 'green' : 'gray'"> 
        Trạng thái : {{ active ? 'Active' : 'Inactive' }}
    </div>

    <!-- Child component with Input/Output -->
    <header-layout [cartCount]="cartCountParent" (buy)="onBuyParent()"></header-layout>
</main>

<router-outlet />
